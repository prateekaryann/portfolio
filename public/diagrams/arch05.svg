<svg viewBox="0 0 1000 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Per-step automation loop: run a step, classify its output as ok, warning, error, or unknown, and continue, pause, or abort accordingly."><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="150" width="150" height="66" rx="12" fill="#14141d" stroke="rgba(255,255,255,.16)" stroke-width="1.2"/><text x="115" y="188" text-anchor="middle" fill="#edecf4" font-size="14.5" font-family="Inter,sans-serif">Run step</text><line x1="190" y1="183" x2="300" y2="183" stroke="#8b5cf6" stroke-width="2" marker-end="url(#m)"/><rect x="300" y="150" width="180" height="66" rx="12" fill="#14141d" stroke="#ec4899" stroke-width="2"/><text x="390" y="180" text-anchor="middle" fill="#edecf4" font-size="14.5" font-family="Inter,sans-serif">Classify</text><text x="390" y="198" text-anchor="middle" fill="#9a99b2" font-size="11.5" font-family="Inter,sans-serif">ok · warn · error · unknown</text><rect x="600" y="24" width="360" height="52" rx="12" fill="#14141d" stroke="#97C459" stroke-width="1.6"/><text x="620" y="54" text-anchor="start" fill="#edecf4" font-size="12.5" font-family="Inter,sans-serif">ok → continue to next step</text><line x1="480" y1="183" x2="600" y2="50" stroke="#97C459" stroke-width="2" marker-end="url(#m)"/><rect x="600" y="108" width="360" height="52" rx="12" fill="#14141d" stroke="#f5b14c" stroke-width="1.6"/><text x="620" y="138" text-anchor="start" fill="#edecf4" font-size="12.5" font-family="Inter,sans-serif">ok-with-warning → pause for human</text><line x1="480" y1="183" x2="600" y2="134" stroke="#f5b14c" stroke-width="2" marker-end="url(#m)"/><rect x="600" y="192" width="360" height="52" rx="12" fill="#14141d" stroke="#e24b4a" stroke-width="1.6"/><text x="620" y="222" text-anchor="start" fill="#edecf4" font-size="12.5" font-family="Inter,sans-serif">error → abort (no damage)</text><line x1="480" y1="183" x2="600" y2="218" stroke="#e24b4a" stroke-width="2" marker-end="url(#m)"/><rect x="600" y="276" width="360" height="52" rx="12" fill="#14141d" stroke="#888780" stroke-width="1.6"/><text x="620" y="306" text-anchor="start" fill="#edecf4" font-size="12.5" font-family="Inter,sans-serif">unknown → pause for human</text><line x1="480" y1="183" x2="600" y2="302" stroke="#888780" stroke-width="2" marker-end="url(#m)"/><path d="M600 50 H120 V150" fill="none" stroke="#97C459" stroke-width="2" marker-end="url(#m)"/><text x="330" y="42" text-anchor="middle" fill="#97C459" font-size="12" font-family="Inter,sans-serif">loop · next step</text></svg>