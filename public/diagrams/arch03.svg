<svg viewBox="0 0 1000 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="gRPC switchover state machine with an explicit fencing step before promotion to prevent split-brain."><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="24" y="34" text-anchor="start" fill="#9a99b2" font-size="12.5" font-family="Inter,sans-serif">gRPC bidirectional stream · authoritative state in PostgreSQL</text><rect x="24" y="70" width="150" height="66" rx="12" fill="#14141d" stroke="rgba(255,255,255,.16)" stroke-width="1.2"/><text x="99" y="108" text-anchor="middle" fill="#edecf4" font-size="14.5" font-family="Inter,sans-serif">Pre-flight</text><rect x="184" y="70" width="150" height="66" rx="12" fill="#14141d" stroke="rgba(255,255,255,.16)" stroke-width="1.2"/><text x="259" y="108" text-anchor="middle" fill="#edecf4" font-size="14.5" font-family="Inter,sans-serif">Quiesce</text><rect x="344" y="70" width="150" height="66" rx="12" fill="#14141d" stroke="rgba(255,255,255,.16)" stroke-width="1.2"/><text x="419" y="108" text-anchor="middle" fill="#edecf4" font-size="14.5" font-family="Inter,sans-serif">Catch-up</text><rect x="504" y="70" width="150" height="66" rx="12" fill="#14141d" stroke="#f5b14c" stroke-width="2"/><text x="579" y="108" text-anchor="middle" fill="#edecf4" font-size="14.5" font-family="Inter,sans-serif">Fence</text><rect x="664" y="70" width="150" height="66" rx="12" fill="#14141d" stroke="rgba(255,255,255,.16)" stroke-width="1.2"/><text x="739" y="108" text-anchor="middle" fill="#edecf4" font-size="14.5" font-family="Inter,sans-serif">Promote</text><rect x="824" y="70" width="150" height="66" rx="12" fill="#14141d" stroke="rgba(255,255,255,.16)" stroke-width="1.2"/><text x="899" y="108" text-anchor="middle" fill="#edecf4" font-size="14.5" font